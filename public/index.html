<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Task Manager</h1>

        <p class="subtitle">
            Manage your tasks
        </p>

        <div class="add-task">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >

            <button onclick="addTask()">
                Add Task
            </button>

        </div>

        <div class="stats">

            <div>
                <strong id="totalTasks">0</strong>
                <span>Total</span>
            </div>

            <div>
                <strong id="completedTasks">0</strong>
                <span>Completed</span>
            </div>

            <div>
                <strong id="pendingTasks">0</strong>
                <span>Pending</span>
            </div>

        </div>

        <ul id="taskList"></ul>

    </div>

    <script src="app.js"></script>

</body>

</html>
